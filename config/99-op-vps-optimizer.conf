
# OP-VPS Optimizer
# Author: OfficialOnePesewa
# Managed by /opt/op-vps-optimizer

# Allow forwarding for VPS tunneling when required.
net.ipv4.ip_forward = 1
net.ipv6.conf.all.forwarding = 1

# TCP buffer auto-tuning limits.
net.ipv4.tcp_moderate_rcvbuf = 1
net.ipv4.tcp_rmem = 4096 131072 8388608
net.ipv4.tcp_wmem = 4096 65536 8388608

# UDP and general socket buffers: maximums, not per-client reservations.
net.core.rmem_max = 8388608
net.core.wmem_max = 8388608
net.core.optmem_max = 65536

# Reasonable listen and packet-processing queues.
net.core.somaxconn = 4096
net.core.netdev_max_backlog = 8192
net.ipv4.tcp_max_syn_backlog = 8192

# Keep connections alive when supported by the application.
net.ipv4.tcp_keepalive_time = 300
net.ipv4.tcp_keepalive_intvl = 30
net.ipv4.tcp_keepalive_probes = 5

# Avoid restarting TCP slow start after an idle period.
net.ipv4.tcp_slow_start_after_idle = 0
